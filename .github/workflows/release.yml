name: Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - ci/automated-release
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        shell: bash
        run: |
          set -euxo pipefail

          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            TAG="$GITHUB_REF_NAME"
            VERSION="${TAG#v}"
            PUBLISH=true
          else
            TAG=""
            VERSION="$(xcodebuild -project iClipboard.xcodeproj -scheme iClipboard -configuration Release -showBuildSettings | awk '/ MARKETING_VERSION = / {print $3; exit}')"
            PUBLISH=false
          fi

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version: $VERSION" >&2
            exit 1
          fi

          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "PUBLISH=$PUBLISH" >> "$GITHUB_ENV"
          echo "Resolved version: $VERSION (publish=$PUBLISH)"

      - name: Build unsigned universal Release app
        shell: bash
        run: |
          set -euxo pipefail
          xcodebuild \
            -project iClipboard.xcodeproj \
            -scheme iClipboard \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            -destination 'platform=macOS' \
            ARCHS='arm64 x86_64' \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            build

          APP='build/DerivedData/Build/Products/Release/iClipboard.app'
          BIN="$APP/Contents/MacOS/iClipboard"
          test -d "$APP"
          test -f "$BIN"

          lipo -info "$BIN"
          lipo "$BIN" -verify_arch arm64 x86_64

          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Contents/Info.plist")" = 'com.tenom.iClipboard'
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Contents/Info.plist")" = "$VERSION"

          if codesign -dv "$APP" >/dev/null 2>&1; then
            echo 'Unexpected signature found' >&2
            exit 1
          else
            echo 'PASS: release app is unsigned'
          fi

      - name: Package ZIP and DMG
        shell: bash
        run: |
          set -euxo pipefail
          APP='build/DerivedData/Build/Products/Release/iClipboard.app'
          OUT='build/release'
          STAGE="$RUNNER_TEMP/dmg-stage"
          ZIP="$OUT/iClipboard-${VERSION}.zip"
          DMG="$OUT/iClipboard-${VERSION}.dmg"

          mkdir -p "$OUT"

          ditto -c -k --sequesterRsrc --keepParent "$APP" "$ZIP"

          rm -rf "$STAGE"
          mkdir -p "$STAGE"
          ditto "$APP" "$STAGE/iClipboard.app"
          ln -s /Applications "$STAGE/Applications"

          hdiutil create \
            -volname "iClipboard ${VERSION}" \
            -srcfolder "$STAGE" \
            -ov \
            -format UDZO \
            "$DMG"

          shasum -a 256 "$ZIP" "$DMG" | tee "$OUT/SHA256SUMS.txt"

      - name: Upload packaged artifact
        uses: actions/upload-artifact@v4
        with:
          name: iClipboard-${{ env.VERSION }}-unsigned
          path: |
            build/release/iClipboard-${{ env.VERSION }}.zip
            build/release/iClipboard-${{ env.VERSION }}.dmg
            build/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: env.PUBLISH == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          ZIP="build/release/iClipboard-${VERSION}.zip"
          DMG="build/release/iClipboard-${VERSION}.dmg"
          SUMS='build/release/SHA256SUMS.txt'

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ZIP" "$DMG" "$SUMS" --clobber
          else
            gh release create "$TAG" \
              "$ZIP" \
              "$DMG" \
              "$SUMS" \
              --title "$TAG" \
              --generate-notes
          fi
